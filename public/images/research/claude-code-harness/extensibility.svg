<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img">
  <title>Three injection points and tool pool assembly</title>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
      .inj { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.7; }
      .lbl { font: 600 12.5px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 10.5px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .title { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #047857; }
    </style>
  </defs>
  <rect width="860" height="360" rx="12" fill="#ffffff"/>
  <text x="28" y="32" class="title">Tools &amp; extensibility · 3 injection points</text>
  <text x="28" y="50" class="sub">assemble() · model() · execute()</text>

  <rect x="40" y="80" width="180" height="64" rx="12" class="inj"/>
  <text x="130" y="108" text-anchor="middle" class="mono">assemble()</text>
  <text x="130" y="128" text-anchor="middle" class="sub">what the model sees</text>

  <rect x="280" y="80" width="180" height="64" rx="12" class="inj"/>
  <text x="370" y="108" text-anchor="middle" class="mono">model()</text>
  <text x="370" y="128" text-anchor="middle" class="sub">what it can reach</text>

  <rect x="520" y="80" width="180" height="64" rx="12" class="inj"/>
  <text x="610" y="108" text-anchor="middle" class="mono">execute()</text>
  <text x="610" y="128" text-anchor="middle" class="sub">whether / how it runs</text>

  <line x1="220" y1="112" x2="276" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="460" y1="112" x2="516" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar2)"/>

  <text x="40" y="186" class="lbl">Tool pool assembly</text>
  <g font-size="11">
    <rect x="40" y="200" width="130" height="40" rx="8" class="box"/><text x="105" y="224" text-anchor="middle" class="lbl">Enumerate ≤54</text>
    <rect x="200" y="200" width="110" height="40" rx="8" class="box"/><text x="255" y="224" text-anchor="middle" class="lbl">Mode filter</text>
    <rect x="340" y="200" width="120" height="40" rx="8" class="box"/><text x="400" y="224" text-anchor="middle" class="lbl">Deny pre-filter</text>
    <rect x="490" y="200" width="120" height="40" rx="8" class="box"/><text x="550" y="224" text-anchor="middle" class="lbl">MCP integrate</text>
    <rect x="640" y="200" width="90" height="40" rx="8" class="box"/><text x="685" y="224" text-anchor="middle" class="lbl">Dedup</text>
  </g>
  <line x1="170" y1="220" x2="196" y2="220" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="310" y1="220" x2="336" y2="220" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="460" y1="220" x2="486" y2="220" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="610" y1="220" x2="636" y2="220" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar2)"/>

  <text x="40" y="280" class="lbl">Extension mechanisms (context cost ↑)</text>
  <rect x="40" y="296" width="170" height="40" rx="8" class="box"/><text x="125" y="320" text-anchor="middle" class="lbl">Hooks · zero</text>
  <rect x="230" y="296" width="170" height="40" rx="8" class="box"/><text x="315" y="320" text-anchor="middle" class="lbl">Skills · low</text>
  <rect x="420" y="296" width="170" height="40" rx="8" class="box"/><text x="505" y="320" text-anchor="middle" class="lbl">Plugins · medium</text>
  <rect x="610" y="296" width="170" height="40" rx="8" class="box"/><text x="695" y="320" text-anchor="middle" class="lbl">MCP · high</text>
</svg>
