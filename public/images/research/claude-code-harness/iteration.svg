<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img">
  <title>Runtime turn loop</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
      .core { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.8; }
      .gate { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.6; }
      .end { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.6; }
      .lbl { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 10.5px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .title { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .n { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: #10b981; }
    </style>
  </defs>
  <rect width="720" height="480" rx="12" fill="#ffffff"/>
  <text x="28" y="32" class="title">Turn loop · 9-step pipeline</text>
  <text x="28" y="50" class="sub">Until the model emits no tool use → assistant response</text>

  <!-- vertical pipeline left -->
  <g>
    <rect x="48" y="72" width="200" height="36" rx="8" class="box"/>
    <text x="60" y="94" class="n">1-3</text>
    <text x="100" y="94" class="lbl">Settings · State · Context</text>

    <rect x="48" y="128" width="200" height="36" rx="8" class="box"/>
    <text x="60" y="150" class="n">4</text>
    <text x="100" y="150" class="lbl">Five pre-model shapers</text>

    <rect x="48" y="184" width="200" height="40" rx="8" class="core"/>
    <text x="60" y="208" class="n">5</text>
    <text x="100" y="208" class="lbl">Model call</text>

    <rect x="48" y="244" width="200" height="36" rx="8" class="box"/>
    <text x="60" y="266" class="n">6</text>
    <text x="100" y="266" class="lbl">Tool dispatch</text>

    <rect x="48" y="300" width="200" height="40" rx="8" class="gate"/>
    <text x="60" y="324" class="n">7</text>
    <text x="100" y="324" class="lbl">Permission gate</text>

    <rect x="48" y="360" width="200" height="36" rx="8" class="box"/>
    <text x="60" y="382" class="n">8</text>
    <text x="100" y="382" class="lbl">Execute tool</text>

    <rect x="48" y="416" width="200" height="36" rx="8" class="end"/>
    <text x="60" y="438" class="n">9</text>
    <text x="100" y="438" class="lbl">Stop condition</text>
  </g>

  <line x1="148" y1="108" x2="148" y2="126" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="148" y1="164" x2="148" y2="182" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="148" y1="224" x2="148" y2="242" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="148" y1="280" x2="148" y2="298" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="148" y1="340" x2="148" y2="358" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="148" y1="396" x2="148" y2="414" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- loop annotations -->
  <path d="M 260 320 C 360 320, 360 200, 260 204" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="370" y="268" class="lbl" fill="#b45309">Deny feedback</text>
  <text x="370" y="284" class="sub">loop for more iterations</text>

  <path d="M 260 378 C 420 378, 420 204, 260 204" fill="none" stroke="#10b981" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="430" y="360" class="lbl" fill="#047857">Tool result</text>
  <text x="430" y="376" class="sub">back to model call</text>

  <rect x="340" y="400" width="220" height="48" rx="10" class="end"/>
  <text x="450" y="422" text-anchor="middle" class="lbl">No tool use → response</text>
  <text x="450" y="438" text-anchor="middle" class="sub">turn complete</text>
  <line x1="248" y1="434" x2="336" y2="424" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#a)"/>
</svg>
