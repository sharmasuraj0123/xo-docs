<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="t d">
  <title id="t">High-level Claude Code system structure</title>
  <desc id="d">User to Interfaces to Agent Loop, with Permissions, Tools, and State, over an Execution Environment</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .box-core { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .box-side { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .box-env { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; }
      .lbl { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .title { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="860" height="420" rx="12" fill="#ffffff"/>
  <text x="28" y="32" class="title">System at a glance · 7 components</text>
  <text x="28" y="52" class="sub">User → Interfaces → Agent Loop · Permissions · Tools · State → Execution Environment</text>

  <!-- User -->
  <rect x="40" y="90" width="120" height="56" rx="10" class="box"/>
  <text x="100" y="114" text-anchor="middle" class="lbl">User</text>
  <text x="100" y="132" text-anchor="middle" class="sub">prompts · review</text>

  <!-- Interfaces -->
  <rect x="220" y="90" width="150" height="56" rx="10" class="box"/>
  <text x="295" y="114" text-anchor="middle" class="lbl">Interfaces</text>
  <text x="295" y="132" text-anchor="middle" class="sub">CLI · SDK · IDE · -p</text>

  <!-- Agent Loop -->
  <rect x="430" y="78" width="170" height="80" rx="12" class="box-core"/>
  <text x="515" y="112" text-anchor="middle" class="lbl">Agent Loop</text>
  <text x="515" y="132" text-anchor="middle" class="sub">queryLoop</text>
  <text x="515" y="148" text-anchor="middle" class="sub">call → tools → repeat</text>

  <!-- Arrows main -->
  <line x1="160" y1="118" x2="216" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="118" x2="426" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Side systems -->
  <rect x="240" y="210" width="130" height="58" rx="10" class="box-side"/>
  <text x="305" y="234" text-anchor="middle" class="lbl">Permissions</text>
  <text x="305" y="252" text-anchor="middle" class="sub">deny · ask · allow</text>

  <rect x="400" y="210" width="130" height="58" rx="10" class="box-side"/>
  <text x="465" y="234" text-anchor="middle" class="lbl">Tools</text>
  <text x="465" y="252" text-anchor="middle" class="sub">≤54 + MCP</text>

  <rect x="560" y="210" width="140" height="58" rx="10" class="box-side"/>
  <text x="630" y="234" text-anchor="middle" class="lbl">State</text>
  <text x="630" y="252" text-anchor="middle" class="sub">JSONL · history</text>

  <line x1="470" y1="158" x2="305" y2="208" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="515" y1="158" x2="465" y2="208" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="560" y1="158" x2="630" y2="208" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- Exec env -->
  <rect x="200" y="320" width="460" height="64" rx="12" class="box-env"/>
  <text x="430" y="348" text-anchor="middle" class="lbl">Execution Environment</text>
  <text x="430" y="368" text-anchor="middle" class="sub">Shell (sandboxed) · Filesystem · Web fetch · MCP connections</text>

  <line x1="305" y1="268" x2="360" y2="318" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="465" y1="268" x2="430" y2="318" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="630" y1="268" x2="500" y2="318" stroke="#94a3b8" stroke-width="1.25" marker-end="url(#arrow)"/>
</svg>
