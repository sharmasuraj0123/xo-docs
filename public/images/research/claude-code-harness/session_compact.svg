<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img">
  <title>Session persistence and compaction</title>
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
      .chan { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .ckpt { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.6; }
      .lbl { font: 600 12.5px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 10.5px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .title { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="800" height="380" rx="12" fill="#ffffff"/>
  <text x="28" y="32" class="title">Session persistence · append-only JSONL</text>
  <text x="28" y="50" class="sub">Auditability and simplicity over query power</text>

  <text x="40" y="88" class="lbl">3 channels</text>
  <rect x="40" y="100" width="220" height="64" rx="10" class="chan"/>
  <text x="150" y="128" text-anchor="middle" class="lbl">Session transcripts</text>
  <text x="150" y="146" text-anchor="middle" class="sub">chain-patched at compact</text>

  <rect x="290" y="100" width="220" height="64" rx="10" class="chan"/>
  <text x="400" y="128" text-anchor="middle" class="lbl">history.jsonl</text>
  <text x="400" y="146" text-anchor="middle" class="sub">↑-arrow prompt recall</text>

  <rect x="540" y="100" width="220" height="64" rx="10" class="chan"/>
  <text x="650" y="128" text-anchor="middle" class="lbl">Subagent sidechains</text>
  <text x="650" y="146" text-anchor="middle" class="sub">one JSONL each</text>

  <text x="40" y="200" class="lbl">Compaction flow</text>
  <rect x="40" y="216" width="160" height="44" rx="8" class="box"/>
  <text x="120" y="242" text-anchor="middle" class="lbl">Drop tool outs</text>
  <rect x="240" y="216" width="160" height="44" rx="8" class="box"/>
  <text x="320" y="242" text-anchor="middle" class="lbl">Session summary</text>
  <rect x="440" y="216" width="160" height="44" rx="8" class="box"/>
  <text x="520" y="242" text-anchor="middle" class="lbl">Mark boundary</text>
  <rect x="640" y="216" width="120" height="44" rx="8" class="ckpt"/>
  <text x="700" y="242" text-anchor="middle" class="lbl">Checkpoint</text>

  <line x1="200" y1="238" x2="236" y2="238" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar4)"/>
  <line x1="400" y1="238" x2="436" y2="238" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar4)"/>
  <line x1="600" y1="238" x2="636" y2="238" stroke="#64748b" stroke-width="1.3" marker-end="url(#ar4)"/>

  <text x="40" y="300" class="lbl">From checkpoints</text>
  <rect x="40" y="316" width="140" height="40" rx="8" class="ckpt"/><text x="110" y="340" text-anchor="middle" class="lbl">Rewind</text>
  <rect x="200" y="316" width="140" height="40" rx="8" class="ckpt"/><text x="270" y="340" text-anchor="middle" class="lbl">Resume</text>
  <rect x="360" y="316" width="140" height="40" rx="8" class="ckpt"/><text x="430" y="340" text-anchor="middle" class="lbl">Fork</text>
  <rect x="520" y="316" width="240" height="40" rx="8" class="box"/>
  <text x="640" y="340" text-anchor="middle" class="sub">Permissions never restored</text>
</svg>
