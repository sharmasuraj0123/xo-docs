<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img">
  <title>Context construction and five shapers</title>
  <style>
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.3; }
    .src { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.3; }
    .shape { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.4; }
    .lbl { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    .sub { font: 10.5px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
    .title { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    .sm { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
  </style>
  <rect width="800" height="460" rx="12" fill="#ffffff"/>
  <text x="28" y="32" class="title">Context · 9 sources + 5 pre-model shapers</text>
  <text x="28" y="50" class="sub">Shapers run cheapest-first before every model call</text>

  <text x="40" y="84" class="lbl">9 ordered sources</text>
  <g>
    <rect x="40" y="96" width="300" height="28" rx="6" class="src"/><text x="52" y="114" class="sm">1 System prompt</text>
    <rect x="40" y="130" width="300" height="28" rx="6" class="src"/><text x="52" y="148" class="sm">2 Environment info</text>
    <rect x="40" y="164" width="300" height="28" rx="6" class="src"/><text x="52" y="182" class="sm">3 CLAUDE.md hierarchy (4 levels)</text>
    <rect x="40" y="198" width="300" height="28" rx="6" class="src"/><text x="52" y="216" class="sm">4 Path-scoped rules</text>
    <rect x="40" y="232" width="300" height="28" rx="6" class="src"/><text x="52" y="250" class="sm">5 Auto-memory (file headers, ≤5)</text>
    <rect x="40" y="266" width="300" height="28" rx="6" class="src"/><text x="52" y="284" class="sm">6 Tool metadata</text>
    <rect x="40" y="300" width="300" height="28" rx="6" class="src"/><text x="52" y="318" class="sm">7 Conversation history</text>
    <rect x="40" y="334" width="300" height="28" rx="6" class="src"/><text x="52" y="352" class="sm">8 Tool results</text>
    <rect x="40" y="368" width="300" height="28" rx="6" class="src"/><text x="52" y="386" class="sm">9 Compact summaries</text>
  </g>

  <text x="400" y="84" class="lbl">5 shapers (cheapest → last resort)</text>
  <g>
    <rect x="400" y="96" width="360" height="48" rx="8" class="shape"/>
    <text x="416" y="116" class="sm"><tspan font-weight="700">Budget Reduction</tspan> · always · size caps</text>
    <text x="416" y="132" class="sub">Per-message caps</text>

    <rect x="400" y="156" width="360" height="48" rx="8" class="shape"/>
    <text x="416" y="176" class="sm"><tspan font-weight="700">Snip</tspan> · HISTORY_SNIP</text>
    <text x="416" y="192" class="sub">Trim older history</text>

    <rect x="400" y="216" width="360" height="48" rx="8" class="shape"/>
    <text x="416" y="236" class="sm"><tspan font-weight="700">Microcompact</tspan> · time-based</text>
    <text x="416" y="252" class="sub">Cache-aware compression</text>

    <rect x="400" y="276" width="360" height="48" rx="8" class="shape"/>
    <text x="416" y="296" class="sm"><tspan font-weight="700">Context Collapse</tspan> · CONTEXT_COLLAPSE</text>
    <text x="416" y="312" class="sub">Virtual projection · non-destructive</text>

    <rect x="400" y="336" width="360" height="48" rx="8" class="shape"/>
    <text x="416" y="356" class="sm"><tspan font-weight="700">Auto-Compact</tspan> · last resort</text>
    <text x="416" y="372" class="sub">Full model-generated summary</text>
  </g>

  <rect x="40" y="412" width="720" height="32" rx="8" class="box"/>
  <text x="400" y="432" text-anchor="middle" class="sub">CLAUDE.md = user context (probabilistic) · permissions = deterministic enforcement</text>
</svg>
