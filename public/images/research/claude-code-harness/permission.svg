<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Permission gate overview</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
      .core { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.8; }
      .deny { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .allow { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .ask { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .lbl { font: 600 12.5px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 10.5px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .title { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="800" height="400" rx="12" fill="#ffffff"/>
  <text x="28" y="32" class="title">Permission system · deny-first</text>
  <text x="28" y="50" class="sub">Deny always overrides allow - even a more specific allow</text>

  <rect x="40" y="90" width="130" height="56" rx="10" class="box"/>
  <text x="105" y="114" text-anchor="middle" class="lbl">Tool use</text>
  <text x="105" y="132" text-anchor="middle" class="sub">model request</text>

  <rect x="240" y="80" width="200" height="76" rx="12" class="core"/>
  <text x="340" y="110" text-anchor="middle" class="lbl">Policy Core</text>
  <text x="340" y="128" text-anchor="middle" class="sub">Rules · Modes · Hooks</text>
  <text x="340" y="144" text-anchor="middle" class="sub">+ auto classifier</text>

  <line x1="170" y1="118" x2="236" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="520" y="48" width="120" height="48" rx="10" class="deny"/>
  <text x="580" y="76" text-anchor="middle" class="lbl">Deny</text>
  <rect x="520" y="118" width="120" height="48" rx="10" class="allow"/>
  <text x="580" y="146" text-anchor="middle" class="lbl">Allow</text>
  <rect x="520" y="188" width="120" height="48" rx="10" class="ask"/>
  <text x="580" y="216" text-anchor="middle" class="lbl">Ask</text>

  <line x1="440" y1="100" x2="516" y2="72" stroke="#ef4444" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="440" y1="118" x2="516" y2="142" stroke="#10b981" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="440" y1="136" x2="516" y2="212" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#ar)"/>

  <text x="40" y="220" class="lbl">7 safety layers (all must pass)</text>
  <rect x="40" y="236" width="720" height="130" rx="12" class="box"/>
  <text x="56" y="262" class="sub">1 Pre-filter tools · 2 Deny-first rules · 3 Mode constraints · 4 ML classifier</text>
  <text x="56" y="286" class="sub">5 Shell sandbox · 6 No restore on resume · 7 PreToolUse hooks</text>
  <text x="56" y="320" class="lbl">Modes (trust ↑)</text>
  <text x="56" y="342" class="sub">plan · default · acceptEdits · auto · dontAsk · bypassPermissions · bubble</text>
</svg>
