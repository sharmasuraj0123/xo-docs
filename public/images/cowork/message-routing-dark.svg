<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d"><title id="t">Where your message goes</title><desc id="d">Where a message goes depends on where you write it. A message to the Workspace goes to the Workspace coordinator, which passes it to the right projects. A message to a project goes to that project's coordinator, which answers or starts a thread. An @project mention goes to that project's coordinator as new work. A reply in a thread goes straight to that thread's agent.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#4f5d43"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle"><text x="138.0" y="38" font-size="12" font-weight="600" letter-spacing="1.2" fill="#a3ad9b">YOU WRITE IN</text><text x="460.0" y="38" font-size="12" font-weight="600" letter-spacing="1.2" fill="#a3ad9b">IT GOES TO</text><text x="802.0" y="38" font-size="12" font-weight="600" letter-spacing="1.2" fill="#a3ad9b">AND THEN</text><rect x="24" y="60" width="228" height="68" rx="14" fill="#14180f" stroke="#34402b" stroke-width="1.5"/><text x="138.0" y="90" font-size="17" font-weight="600" fill="#e9eee4">The Workspace</text><text x="138.0" y="112" font-size="13" fill="#a3ad9b">Not sure where it belongs</text><path d="M256 94.0 H316" stroke="#4f5d43" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="320" y="60" width="280" height="68" rx="14" fill="#1e2a14" stroke="#8fd14f" stroke-width="2"/><text x="460.0" y="90" font-size="17" font-weight="600" fill="#e9eee4">Workspace coordinator</text><text x="460.0" y="112" font-size="13" fill="#a3ad9b">Sees every project</text><path d="M604 94.0 H664" stroke="#4f5d43" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="668" y="60" width="268" height="68" rx="14" fill="#181c15" stroke="#34402b" stroke-width="1.5"/><text x="802.0" y="90" font-size="17" font-weight="600" fill="#e9eee4">The right project(s)</text><text x="802.0" y="112" font-size="13" fill="#a3ad9b">Or it answers you itself</text><rect x="24" y="150" width="228" height="68" rx="14" fill="#14180f" stroke="#34402b" stroke-width="1.5"/><text x="138.0" y="180" font-size="17" font-weight="600" fill="#e9eee4">A project</text><text x="138.0" y="202" font-size="13" fill="#a3ad9b">Work for one project</text><path d="M256 184.0 H316" stroke="#4f5d43" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="320" y="150" width="280" height="68" rx="14" fill="#1e2a14" stroke="#8fd14f" stroke-width="2"/><text x="460.0" y="180" font-size="17" font-weight="600" fill="#e9eee4">That project's coordinator</text><text x="460.0" y="202" font-size="13" fill="#a3ad9b">Knows that project</text><path d="M604 184.0 H664" stroke="#4f5d43" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="668" y="150" width="268" height="68" rx="14" fill="#181c15" stroke="#34402b" stroke-width="1.5"/><text x="802.0" y="180" font-size="17" font-weight="600" fill="#e9eee4">An answer, or a thread</text><text x="802.0" y="202" font-size="13" fill="#a3ad9b">Changes always go to a thread</text><rect x="24" y="240" width="228" height="68" rx="14" fill="#14180f" stroke="#34402b" stroke-width="1.5"/><text x="138.0" y="270" font-size="17" font-weight="600" fill="#8fd14f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@billing-api …</text><text x="138.0" y="292" font-size="13" fill="#a3ad9b">From anywhere, even a thread</text><path d="M256 274.0 H316" stroke="#4f5d43" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="320" y="240" width="280" height="68" rx="14" fill="#1e2a14" stroke="#8fd14f" stroke-width="2"/><text x="460.0" y="270" font-size="17" font-weight="600" fill="#e9eee4">billing-api's coordinator</text><text x="460.0" y="292" font-size="13" fill="#a3ad9b">Takes it as new work</text><path d="M604 274.0 H664" stroke="#4f5d43" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="668" y="240" width="268" height="68" rx="14" fill="#181c15" stroke="#34402b" stroke-width="1.5"/><text x="802.0" y="270" font-size="17" font-weight="600" fill="#e9eee4">An answer, or a thread</text><text x="802.0" y="292" font-size="13" fill="#a3ad9b">Not a reply in the current thread</text><rect x="24" y="330" width="228" height="68" rx="14" fill="#14180f" stroke="#34402b" stroke-width="1.5"/><text x="138.0" y="360" font-size="17" font-weight="600" fill="#e9eee4">A thread</text><text x="138.0" y="382" font-size="13" fill="#a3ad9b">A reply to work in progress</text><path d="M256 364.0 H316" stroke="#4f5d43" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="320" y="330" width="280" height="68" rx="14" fill="#1e2a14" stroke="#8fd14f" stroke-width="2"/><text x="460.0" y="360" font-size="17" font-weight="600" fill="#e9eee4">That thread's agent</text><text x="460.0" y="382" font-size="13" fill="#a3ad9b">Directly, no coordinator</text><text x="802.0" y="369.0" font-size="14" font-style="italic" fill="#a3ad9b">The agent replies in the thread</text></g></svg>