<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
  <title>Subagent delegation architecture</title>
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
      .parent { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.8; }
      .child { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .lbl { font: 600 12.5px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 10.5px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .title { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="800" height="400" rx="12" fill="#ffffff"/>
  <text x="28" y="32" class="title">Subagent delegation · isolated context</text>
  <text x="28" y="50" class="sub">Only the summary returns to the parent - full history stays on the sidechain</text>

  <rect x="280" y="80" width="240" height="70" rx="12" class="parent"/>
  <text x="400" y="110" text-anchor="middle" class="lbl">Parent agent</text>
  <text x="400" y="130" text-anchor="middle" class="sub">shared conversation window</text>

  <rect x="60" y="220" width="180" height="70" rx="12" class="child"/>
  <text x="150" y="250" text-anchor="middle" class="lbl">Subagent A</text>
  <text x="150" y="268" text-anchor="middle" class="sub">own .jsonl sidechain</text>

  <rect x="310" y="220" width="180" height="70" rx="12" class="child"/>
  <text x="400" y="250" text-anchor="middle" class="lbl">Subagent B</text>
  <text x="400" y="268" text-anchor="middle" class="sub">isolated window</text>

  <rect x="560" y="220" width="180" height="70" rx="12" class="child"/>
  <text x="650" y="250" text-anchor="middle" class="lbl">Subagent C</text>
  <text x="650" y="268" text-anchor="middle" class="sub">≈7× tokens if AgentTool</text>

  <line x1="340" y1="150" x2="150" y2="218" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar3)"/>
  <line x1="400" y1="150" x2="400" y2="218" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar3)"/>
  <line x1="460" y1="150" x2="650" y2="218" stroke="#64748b" stroke-width="1.4" marker-end="url(#ar3)"/>

  <path d="M150 290 C150 330, 400 330, 400 150" fill="none" stroke="#10b981" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar3)"/>
  <text x="220" y="330" class="sub">summary only</text>

  <rect x="60" y="350" width="680" height="36" rx="8" class="box"/>
  <text x="400" y="372" text-anchor="middle" class="sub">Isolation: Worktree · Remote · In-process (default) · types: Explore · Plan · General · Guide · Verification · Statusline</text>
</svg>
