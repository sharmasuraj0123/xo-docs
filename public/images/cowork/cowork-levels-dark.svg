<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d"><title id="t">How XO Cowork is organised</title><desc id="d">You talk to the Workspace coordinator, which sees every project. Each project has its own coordinator. Projects start threads; each thread has its own agent and works in its own copy of the project.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#4f5d43"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle"><rect x="432.0" y="24" width="96" height="40" rx="20" fill="#8fd14f"/><text x="480.0" y="50" font-size="17" font-weight="600" fill="#181c15">You</text><path d="M480.0 64 L480.0 104" stroke="#4f5d43" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="310.0" y="108" width="340" height="76" rx="14" fill="#1e2a14" stroke="#8fd14f" stroke-width="2"/><text x="480.0" y="142.0" font-size="19" font-weight="600" fill="#e9eee4">Workspace coordinator</text><text x="480.0" y="166.0" font-size="14" fill="#a3ad9b">Sees every project</text><path d="M480.0 184 V222 H190 V262" stroke="#4f5d43" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M480.0 184 V222 H480 V262" stroke="#4f5d43" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M480.0 184 V222 H770 V262" stroke="#4f5d43" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="75.0" y="266" width="230" height="76" rx="14" fill="#181c15" stroke="#34402b" stroke-width="1.5"/><text x="190" y="300.0" font-size="19" font-weight="600" fill="#e9eee4">Project A</text><text x="190" y="324.0" font-size="14" fill="#a3ad9b">Its own coordinator</text><rect x="365.0" y="266" width="230" height="76" rx="14" fill="#181c15" stroke="#34402b" stroke-width="1.5"/><text x="480" y="300.0" font-size="19" font-weight="600" fill="#e9eee4">Project B</text><text x="480" y="324.0" font-size="14" fill="#a3ad9b">Its own coordinator</text><rect x="655.0" y="266" width="230" height="76" rx="14" fill="#181c15" stroke="#34402b" stroke-width="1.5"/><text x="770" y="300.0" font-size="19" font-weight="600" fill="#e9eee4">Project C</text><text x="770" y="324.0" font-size="14" fill="#a3ad9b">Its own coordinator</text><path d="M190 342 V382 H110 V424" stroke="#4f5d43" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M190 342 V382 H270 V424" stroke="#4f5d43" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M480 342 V382 H480 V424" stroke="#4f5d43" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="44" y="428" width="132" height="46" rx="23" fill="#14180f" stroke="#34402b" stroke-width="1.5"/><circle cx="72" cy="451" r="5" fill="#8fd14f"/><text x="118" y="457" font-size="16" font-weight="500" fill="#e9eee4">Thread</text><rect x="204" y="428" width="132" height="46" rx="23" fill="#14180f" stroke="#34402b" stroke-width="1.5"/><circle cx="232" cy="451" r="5" fill="#8fd14f"/><text x="278" y="457" font-size="16" font-weight="500" fill="#e9eee4">Thread</text><rect x="414" y="428" width="132" height="46" rx="23" fill="#14180f" stroke="#34402b" stroke-width="1.5"/><circle cx="442" cy="451" r="5" fill="#8fd14f"/><text x="488" y="457" font-size="16" font-weight="500" fill="#e9eee4">Thread</text><text x="770" y="456" font-size="14" font-style="italic" fill="#a3ad9b">No threads yet</text><text x="480.0" y="534" font-size="15" fill="#a3ad9b">Each thread is one piece of work: its own agent, a live checklist,</text><text x="480.0" y="558" font-size="15" fill="#a3ad9b">and its own copy of the project, so threads never get in each other's way.</text></g></svg>