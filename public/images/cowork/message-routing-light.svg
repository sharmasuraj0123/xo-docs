<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d"><title id="t">Where your message goes</title><desc id="d">Where a message goes depends on where you write it. A message to the Workspace goes to the Workspace coordinator, which passes it to the right projects. A message to a project goes to that project's coordinator, which answers or starts a thread. An @project mention goes to that project's coordinator as new work. A reply in a thread goes straight to that thread's agent.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#a9b79c"/></marker></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle"><text x="138.0" y="38" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5f6b57">YOU WRITE IN</text><text x="460.0" y="38" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5f6b57">IT GOES TO</text><text x="802.0" y="38" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5f6b57">AND THEN</text><rect x="24" y="60" width="228" height="68" rx="14" fill="#f5f8f1" stroke="#cfd9c6" stroke-width="1.5"/><text x="138.0" y="90" font-size="17" font-weight="600" fill="#1c2416">The Workspace</text><text x="138.0" y="112" font-size="13" fill="#5f6b57">Not sure where it belongs</text><path d="M256 94.0 H316" stroke="#a9b79c" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="320" y="60" width="280" height="68" rx="14" fill="#eef6e6" stroke="#3b7a1c" stroke-width="2"/><text x="460.0" y="90" font-size="17" font-weight="600" fill="#1c2416">Workspace coordinator</text><text x="460.0" y="112" font-size="13" fill="#5f6b57">Sees every project</text><path d="M604 94.0 H664" stroke="#a9b79c" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="668" y="60" width="268" height="68" rx="14" fill="#ffffff" stroke="#cfd9c6" stroke-width="1.5"/><text x="802.0" y="90" font-size="17" font-weight="600" fill="#1c2416">The right project(s)</text><text x="802.0" y="112" font-size="13" fill="#5f6b57">Or it answers you itself</text><rect x="24" y="150" width="228" height="68" rx="14" fill="#f5f8f1" stroke="#cfd9c6" stroke-width="1.5"/><text x="138.0" y="180" font-size="17" font-weight="600" fill="#1c2416">A project</text><text x="138.0" y="202" font-size="13" fill="#5f6b57">Work for one project</text><path d="M256 184.0 H316" stroke="#a9b79c" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="320" y="150" width="280" height="68" rx="14" fill="#eef6e6" stroke="#3b7a1c" stroke-width="2"/><text x="460.0" y="180" font-size="17" font-weight="600" fill="#1c2416">That project's coordinator</text><text x="460.0" y="202" font-size="13" fill="#5f6b57">Knows that project</text><path d="M604 184.0 H664" stroke="#a9b79c" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="668" y="150" width="268" height="68" rx="14" fill="#ffffff" stroke="#cfd9c6" stroke-width="1.5"/><text x="802.0" y="180" font-size="17" font-weight="600" fill="#1c2416">An answer, or a thread</text><text x="802.0" y="202" font-size="13" fill="#5f6b57">Changes always go to a thread</text><rect x="24" y="240" width="228" height="68" rx="14" fill="#f5f8f1" stroke="#cfd9c6" stroke-width="1.5"/><text x="138.0" y="270" font-size="17" font-weight="600" fill="#3b7a1c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@billing-api …</text><text x="138.0" y="292" font-size="13" fill="#5f6b57">From anywhere, even a thread</text><path d="M256 274.0 H316" stroke="#a9b79c" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="320" y="240" width="280" height="68" rx="14" fill="#eef6e6" stroke="#3b7a1c" stroke-width="2"/><text x="460.0" y="270" font-size="17" font-weight="600" fill="#1c2416">billing-api's coordinator</text><text x="460.0" y="292" font-size="13" fill="#5f6b57">Takes it as new work</text><path d="M604 274.0 H664" stroke="#a9b79c" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="668" y="240" width="268" height="68" rx="14" fill="#ffffff" stroke="#cfd9c6" stroke-width="1.5"/><text x="802.0" y="270" font-size="17" font-weight="600" fill="#1c2416">An answer, or a thread</text><text x="802.0" y="292" font-size="13" fill="#5f6b57">Not a reply in the current thread</text><rect x="24" y="330" width="228" height="68" rx="14" fill="#f5f8f1" stroke="#cfd9c6" stroke-width="1.5"/><text x="138.0" y="360" font-size="17" font-weight="600" fill="#1c2416">A thread</text><text x="138.0" y="382" font-size="13" fill="#5f6b57">A reply to work in progress</text><path d="M256 364.0 H316" stroke="#a9b79c" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="320" y="330" width="280" height="68" rx="14" fill="#eef6e6" stroke="#3b7a1c" stroke-width="2"/><text x="460.0" y="360" font-size="17" font-weight="600" fill="#1c2416">That thread's agent</text><text x="460.0" y="382" font-size="13" fill="#5f6b57">Directly, no coordinator</text><text x="802.0" y="369.0" font-size="14" font-style="italic" fill="#5f6b57">The agent replies in the thread</text></g></svg>